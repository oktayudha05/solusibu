 3.028583, 3.409541], ["ke", 3.409541, 3.492874], ["wajan", 3.492875, 4.1]]}, {"mulai": 34.896, "durasi": 3.156, "kata": [["Kering", 0.1, 0.433333], ["dulu", 0.433333, 0.933333], ["baru", 1.242875, 1.588083], ["masuk", 1.588083, 2.040458]]}];

const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
const OIL="#C4B160",TEAL="#3A8F87",CREAM="#FAF7EC";

function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
function loop(a,b,p,f){for(let t=a,i=0;t<b;t+=p,i++)f(t,i)}
const END=38.05;

/* ---------- latar: selalu bergerak ---------- */
tl.fromTo("#dots",{backgroundPosition:"0px 0px"},{backgroundPosition:"-216px 144px",duration:END,ease:"none"},0);

  cs={cx,cy,s};
}
function shake(t,amp,n=9){
  for(let i=0;i<n;i++){const k=amp*(1-i/n);tl.to(shk,{x:(i%2?-1:1)*k,y:(i%3?1:-1)*k*.7,duration:.045,ease:"none"},t+i*.045)}

}

  flames.push([g,s]);
});
flames.forEach(([g,s],i)=>{const r=rng(40+i);

// api membesar waktu "panas banget" & waktu air jadi uap
[[5.0,1.2],[19.0,1.8],[24.0,1.2]].forEach(([t,d])=>flames.forEach(([g,s])=>tl.to(g,{y:1332,duration:.4,ease:"power2.out"},t).to(g,{y:1340,duration:.6,ease:"power2.inOut"},t+d)));

const heat=$("#heat");
loop(0,END,.45,(t,i)=>{
  const r=rng(100+i),x=170+r()*560;if(t>4&&t<14.2)return;
  const p=mk("path",{d:"M0,0 q20,-16 40,0 t40,0 t40,0 t40,0 t40,0",fill:"none",stroke:TEAL,"stroke-width":7,"stroke-linecap":"round",opacity:0},heat);

  tl.fromTo(p,{y:880,opacity:0},{y:800-r()*40,opacity:.55,duration:.5,ease:"power1.out",immediateRender:false},t);
  tl.to(p,{y:"-=40",opacity:0,duration:.6,ease:"power1.in"},t+.5);
});
const ob=$("#obub");
loop(0,END,.28,(t,i)=>{
  const r=rng(500+i);if(t>15.4&&t<18.2)return;

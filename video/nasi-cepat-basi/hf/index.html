function crown(par,t,cx,cy,n,seed,o){

  // mahkota (seperti foto milk crown): kolom cairan tipis melengkung dengan bulatan di ujung, mulus
  const nsp=Math.min(14,Math.round(n/3)+4);
  for(let i=0;i<nsp;i++){
    const a=(i/(nsp-1)-.5)*2.6,h=90+r()*150,wd=4+r()*4,bd=wd*(1.6+r()*.9),e=mk("g",{opacity:0},par);
    const cv=a*h*.18;
    mk("path",{d:`M0,0 Q${cv},${-h*.55} ${cv*1.6},${-h}`,fill:"none",stroke:"url(#gOilV)","stroke-width":wd*2,"stroke-linecap":"round"},e);
    mk("circle",{cx:cv*1.6,cy:-h,r:bd,fill:"url(#gDrop)"},e);
    mk("circle",{cx:cv*1.6-bd*.3,cy:-h-bd*.3,r:bd*.25,fill:"#fff","fill-opacity":.7},e);
    gsap.set(e,{x:cx+Math.sin(a)*(o.size*14),y:cy+10,rotation:a*34,scaleY:0,opacity:0,transformOrigin:"0px 0px"});
    tl.set(e,{opacity:1},t);

    tl.to(e,{scaleY:.05,y:cy+40,duration:.32,ease:"power2.in"},t+.22);
    tl.set(e,{opacity:0},t+.56);
  }
  // tetesan: ukuran acak (kebanyakan kecil), memanjang searah gerak, ekor buram (motion blur)
  for(let i=0;i<n;i++){
    const nr=i<o.near,q=r(),rr=nr?o.size*(1.5+r()*1.0):Math.max(2.5,o.size*(.16+q*q*1.0));
    const a=(r()-.5)*o.spread,dx=Math.sin(a)*o.hgt*(.5+r()*.5),pk=o.hgt*(.35+r()*.65)*Math.cos(a*.5),d=.45+r()*.4;
    const L=rr*(2.4+r()*3.6),e=mk("g",{opacity:nr?0:0},par);
    if(nr){ // dekat kamera: bulatan buram (di luar fokus), bukan bongkahan
      mk("circle",{r:rr*1.5,fill:"#E8A33D","fill-opacity":.55,filter:"url(#fB14)"},e);
    }else{
      // ekor tipis (menyempit mulus) + kepala bulat
      mk("path",{d:`M0,${-rr*.55} Q${-L*.55},${-rr*.2} ${-L},0 Q${-L*.55},${rr*.2} 0,${rr*.55}Z`,fill:"url(#gStreak)","fill-opacity":.85},e);
      mk("circle",{r:rr,fill:"url(#gDrop)"},e);
      if(rr>5)mk("circle",{cx:-rr*.3,cy:-rr*.32,r:rr*.24,fill:"#fff","fill-opacity":.75},e);
    }
    const a0=Math.atan2(-2.2*pk/d,dx/(d*2))*180/PI,a1=Math.atan2(2.2*(pk+110)/d,dx/(d*2))*180/PI;
    gsap.set(e,{x:cx,y:cy,opacity:0,rotation:a0,scaleX:1.5});
    tl.set(e,{opacity:1,x:cx,y:cy,rotation:a0,scaleX:1.5},t);
    tl.to(e,{x:cx+dx,duration:d*2,ease:"none"},t);
    tl.to(e,{y:cy-pk,duration:d,ease:"power2.out"},t);
    tl.to(e,{y:cy+110,duration:d,ease:"power2.in"},t+d);
    tl.to(e,{rotation:a1,duration:d*2,ease:"sine.inOut"},t);
    tl.to(e,{scaleX:.6,duration:d,ease:"power1.out"},t);
    tl.to(e,{scaleX:1.5,duration:d,ease:"power1.in"},t+d);
    if(nr||o.grow>1)tl.to(e,{scaleY:nr?2.4:1+(o.grow-1)*r()*.8,duration:d*2,ease:"power1.in"},t);
    tl.set(e,{opacity:0},t+d*2);
  }
}
